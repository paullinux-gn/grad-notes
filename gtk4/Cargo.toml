[package]
name = "grad-notes-gtk4"
version = "0.5.13"
edition = "2024"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["gtk_v4_10", "v1_9"] }
webkit6 = { version = "0.6.1", features = ["gtk_v4_18"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
grad-notes-backend-core = { path = "backend-core" }

